[project]
name = "channel-toolkit"
version = "0.1.0"
description = "Tooling for growing a YouTube channel: analytics, metadata, and content-ops scripts."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
ai = [
    "anthropic>=0.40",
]

[project.scripts]
channel-toolkit = "channel_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
