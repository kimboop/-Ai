name: Render Shorts Video

on:
  workflow_dispatch:
    inputs:
      episode_file:
        description: '렌더링할 대본 JSON 경로 (예: scripts/episode_2026-08-16_robot-battery.json)'
        required: true
        default: 'scripts/episode.json'
      make_thumbnail:
        description: '썸네일도 같이 만들지 여부'
        required: false
        default: 'true'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Nanum fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum fonts-nanum-extra

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check PIXABAY_API_KEY secret is set
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: test -n "$PIXABAY_API_KEY" || (echo 'Missing PIXABAY_API_KEY secret — Settings > Secrets and variables > Actions > New repository secret' && exit 1)

      - name: Debug PIXABAY_API_KEY (temporary — remove once 403 is diagnosed)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          echo "key length: ${#PIXABAY_API_KEY}"
          echo "first 4 chars: ${PIXABAY_API_KEY:0:4}"
          echo "last 4 chars: ${PIXABAY_API_KEY: -4}"
          echo "--- live Pixabay API test (direct curl, bypassing our Python code) ---"
          curl -s -o /tmp/pixabay_response.json -w "HTTP status: %{http_code}\n" \
            "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=cat&per_page=3"
          echo "response body:"
          cat /tmp/pixabay_response.json
          echo ""
          echo "--- same test but with a browser-like User-Agent, in case a WAF is blocking default curl/runner UA ---"
          curl -s -o /tmp/pixabay_response2.json -w "HTTP status: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=cat&per_page=3"
          echo "response body:"
          cat /tmp/pixabay_response2.json

      - name: Validate episode JSON
        run: python scripts/video_generator.py "${{ github.event.inputs.episode_file }}" --validate-only

      - name: Run logic tests (no network needed)
        run: python scripts/test_mock.py

      - name: Render video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/video_generator.py "${{ github.event.inputs.episode_file }}"

      - name: Generate thumbnail
        if: ${{ github.event.inputs.make_thumbnail == 'true' }}
        run: |
          TITLE=$(python3 -c "import json,sys; print(json.load(open('${{ github.event.inputs.episode_file }}'))['title'])")
          STEM=$(basename "${{ github.event.inputs.episode_file }}" .json)
          python scripts/make_thumbnail.py \
            --title "$TITLE" \
            --kicker "테크 이슈" \
            --output "output/thumbnails/${STEM}.png"

      - name: Upload rendered video + thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/thumbnails/*.png
          if-no-files-found: error
