name: AI Collaboration

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Markdown/text file to process'
        required: true
        default: 'input.md'
  push:
    paths:
      - 'input.md'
      - 'inputs/**'
      - 'orchestrator/**'
      - '.github/workflows/three-ai-collaboration.yml'

permissions:
  contents: write

jobs:
  collaborate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run logic tests (no network needed)
        run: python orchestrator/test_mock.py

      - name: Run Claude (lead) → Gemini (support)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'Missing GEMINI_API_KEY secret' && exit 1)
          test -n "$ANTHROPIC_API_KEY" || (echo 'Missing ANTHROPIC_API_KEY secret' && exit 1)
          python orchestrator/ai_collaboration.py "${{ github.event.inputs.input_file || 'input.md' }}"

      - name: Upload collaboration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-collaboration-${{ github.run_number }}
          path: artifacts/

      - name: Commit final package
        if: always()
        run: |
          git config user.name 'ai-orchestrator[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add artifacts/
            if git diff --cached --quiet; then
              echo 'nothing to commit'
              exit 0
            fi
            git commit -m 'chore: update AI collaboration package'
            git push && exit 0
            echo "push rejected (attempt $attempt/4) -- remote moved again, retrying against its new tip"
            sleep 2
          done
          echo "failed to push after 4 attempts" >&2
          exit 1
