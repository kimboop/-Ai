name: Three AI Collaboration

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Markdown/text file to process'
        required: true
        default: 'input.md'
  push:
    paths:
      - 'input.md'
      - 'inputs/**'
      - 'orchestrator/**'
      - '.github/workflows/three-ai-collaboration.yml'

permissions:
  contents: write

jobs:
  collaborate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug Gemini call (temporary, no key printed)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          echo "--- via x-goog-api-key header ---"
          curl -sS -o /tmp/hdr.json -w "HTTP:%{http_code}\n" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL:-gemini-2.5-flash}:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"hi"}]}]}'
          cat /tmp/hdr.json
          echo "--- via ?key= query param ---"
          curl -sS -o /tmp/qp.json -w "HTTP:%{http_code}\n" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL:-gemini-2.5-flash}:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"hi"}]}]}'
          cat /tmp/qp.json

      - name: Run Gemini → Claude → GPT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo 'Missing GEMINI_API_KEY secret' && exit 1)
          test -n "$ANTHROPIC_API_KEY" || (echo 'Missing ANTHROPIC_API_KEY secret' && exit 1)
          test -n "$OPENAI_API_KEY" || (echo 'Missing OPENAI_API_KEY secret' && exit 1)
          python orchestrator/ai_collaboration.py "${{ github.event.inputs.input_file || 'input.md' }}"

      - name: Upload collaboration reports
        uses: actions/upload-artifact@v4
        with:
          name: three-ai-collaboration-${{ github.run_number }}
          path: artifacts/

      - name: Commit final package
        run: |
          git config user.name 'three-ai-orchestrator[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/
          git diff --cached --quiet || git commit -m 'chore: update three-AI collaboration package'
          git push
